<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת שמירות</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
      text-align:center;
    }

    .box{
      max-width:500px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 4px 18px rgba(0,0,0,.12);
    }

    select{
      font-size:22px;
      padding:12px 20px;
      margin:10px;
      border-radius:12px;
      border:1px solid #ccc;
    }

    button{
      font-size:22px;
      padding:14px 28px;
      margin:8px;
      border:0;
      border-radius:12px;
      cursor:pointer;
    }

    #addBtn{
      background:#222;
      color:white;
    }

    #clearBtn{
      background:#ddd;
    }

    #count{
      font-size:26px;
      margin-top:20px;
      font-weight:bold;
    }

    #total{
      font-size:30px;
      margin:10px 0;
      font-weight:bold;
    }

    #list{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:20px;
    }

    .item{
      background:#eee;
      padding:12px;
      border-radius:10px;
      font-size:20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>רשימת שמירות</h2>

  <select id="valueSelect">
    <option value="0.05">0.05</option>
    <option value="0.1">0.1</option>
    <option value="0.2">0.2</option>
    <option value="0.25">0.25</option>
    <option value="0.3">0.3</option>
    <option value="0.4">0.4</option>
    <option value="0.5">0.5</option>
    <option value="0.6">0.6</option>
    <option value="0.7">0.7</option>
    <option value="0.8">0.8</option>
    <option value="0.9">0.9</option>
    <option value="1">1.0</option>
  </select>

  <br>

  <button id="addBtn">שמור</button>
  <button id="clearBtn">איפוס</button>

  <div id="count">מספר שמירות: 0</div>
  <div id="total">סה״כ: 0</div>

  <div id="list"></div>

</div>

<script>

  const STORAGE_KEY = "numbersList";

  let items =
    JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  const valueSelect =
    document.getElementById("valueSelect");

  const addBtn =
    document.getElementById("addBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const list =
    document.getElementById("list");

  const count =
    document.getElementById("count");

  const total =
    document.getElementById("total");


  function save(){
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(items)
    );
  }


  function formatNumber(number){

    // מציג עד 2 ספרות אחרי הנקודה
    // בלי אפסים מיותרים

    return parseFloat(number.toFixed(2));
  }


  function render(){

    list.innerHTML = "";

    count.textContent =
      "מספר שמירות: " + items.length;


    let sum = items.reduce(
      (a,b) => a + b,
      0
    );


    total.textContent =
      "סה״כ: " + formatNumber(sum);


    items.forEach((value,index)=>{

      const div =
        document.createElement("div");

      div.className = "item";

      div.textContent =
        (index + 1) +
        ". " +
        formatNumber(value);

      list.appendChild(div);

    });

  }


  addBtn.addEventListener("click",()=>{

    const value =
      parseFloat(valueSelect.value);

    items.push(value);

    save();
    render();

  });


  clearBtn.addEventListener("click",()=>{

    if(confirm("לאפס את כל הרשימה?")){

      items = [];

      save();
      render();

    }

  });


  render();

</script>

</body>
</html>
