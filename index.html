<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תרגול גיטרה 🎸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #0c0a09 0%, #1c1917 50%, #0c0a09 100%);
      color: #f5f5f4;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 768px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 800; color: #fef3c7; }
    .subtitle { margin-top: 0.25rem; font-size: 0.875rem; color: #a8a29e; }

    .card {
      background: rgba(28, 25, 23, 0.5);
      border: 1px solid #292524;
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .section + .section { margin-top: 1.25rem; }

    /* Fretboard */
    .fretboard-wrap { width: 100%; user-select: none; }
   .fret-labels {
  display: flex;
  direction: ltr;
  align-items: flex-end;
  margin-bottom: 0.375rem;
}
    .fret-labels .spacer { width: 44px; flex-shrink: 0; }
    .fret-labels .label {
      flex: 1;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(251, 191, 36, 0.5);
    }
    .fretboard {
      position: relative;
      overflow: hidden;
      border-radius: 0.75rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      background: linear-gradient(135deg, #3d2817 0%, #2a1a0e 40%, #3d2817 100%);
      border: 1px solid rgba(120, 53, 15, 0.3);
    }
    .nut {
      position: absolute;
      left: 44px;
      top: 0;
      bottom: 0;
      width: 6px;
      z-index: 20;
      background: linear-gradient(to bottom, #f5f5f4, #d6d3d1);
    }
   
    .string-row.playing { background-color: rgba(251, 191, 36, 0.05); }
   .string-row {
  display: flex;
  flex-direction: row;
  direction: ltr;
  align-items: center;
  height: 48px;
  position: relative;
  transition: background-color 0.2s;
}

.string-name {
  order: -1;
  width: 44px;
  flex-shrink: 0;
  text-align: center;
  font-size: 1rem;
  font-weight: 700;
  color: rgba(251, 191, 36, 0.8);
}
    .pos {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
    }
    .fret-wire {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      z-index: 10;
      background: linear-gradient(to bottom, #71717a, #d4d4d8, #71717a);
    }
    .string-line {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      background: linear-gradient(to right, #71717a, #a1a1aa);
      opacity: 0.7;
      transform: translateY(-50%);
    }
    .hover-ring {
      position: absolute;
      z-index: 20;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      opacity: 0;
      transition: all 0.15s;
    }
    .pos:hover .hover-ring { opacity: 1; width: 24px; height: 24px; box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.4); }
    .note-dot {
      position: relative;
      z-index: 30;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: #f59e0b;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
      transition: all 0.15s;
    }
    .note-dot.playing {
      transform: scale(1.25);
      background: #fbbf24;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.9);
      ring: 4px solid rgba(252, 211, 77, 0.4);
      outline: 2px solid rgba(252, 211, 77, 0.5);
      outline-offset: 2px;
    }

    /* Sequence panel */
    .panel-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
    .panel-title { font-size: 1.125rem; font-weight: 600; color: #f5f5f4; display: flex; align-items: center; gap: 0.5rem; }
    .badge { background: rgba(251, 191, 36, 0.2); color: #fcd34d; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; }
    .btn-group { display: flex; gap: 0.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #d97706; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #ea580c; }
    .btn-outline { background: transparent; border-color: #44403c; color: #d6d3d1; }
    .btn-outline:hover:not(:disabled) { background: #292524; }
    .btn-save { background: #059669; color: #fff; }
    .btn-save:hover:not(:disabled) { background: #10b981; }

    .tempo-row { margin-bottom: 1rem; }
    .tempo-label { font-size: 0.75rem; color: #a8a29e; margin-bottom: 0.25rem; }
    .tempo-slider { display: flex; align-items: center; gap: 0.75rem; direction: ltr; }
    .tempo-slider span { font-size: 0.75rem; color: #a8a29e; white-space: nowrap; }
    input[type="range"] { flex: 1; accent-color: #f59e0b; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; direction: ltr; }
    .chip {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid #44403c;
      background: rgba(41, 37, 36, 0.5);
      color: #d6d3d1;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .chip.playing {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.2);
      color: #fcd34d;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
    }
    .chip .num { font-weight: 700; color: #fbbf24; }
    .chip .sep { color: #78716c; }
    .chip .remove {
      margin-left: 0.125rem;
      color: #78716c;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 0.875rem;
      padding: 0;
      line-height: 1;
    }
    .chip .remove:hover { color: #f87171; }
    .empty { padding: 1rem; text-align: center; font-size: 0.875rem; color: #78716c; }

    /* Save bar */
    .save-bar { display: flex; gap: 0.5rem; }
    .save-bar input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(28, 25, 23, 0.5);
      border: 1px solid #44403c;
      color: #f5f5f4;
      font-size: 0.875rem;
      outline: none;
    }
    .save-bar input:focus { border-color: #f59e0b; }

    /* Saved melodies */
    .melody-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #292524;
      background: rgba(41, 37, 36, 0.3);
      padding: 0.75rem;
    }
    .melody-item + .melody-item { margin-top: 0.5rem; }
    .melody-info { min-width: 0; flex: 1; }
    .melody-name { font-weight: 500; color: #e7e5e4; }
    .melody-notes { font-size: 0.75rem; color: #78716c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
    .melody-actions { display: flex; gap: 0.125rem; flex-shrink: 0; }
    .icon-btn {
      padding: 0.375rem;
      border-radius: 0.375rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #a8a29e;
      font-size: 1rem;
      line-height: 1;
    }
    .icon-btn:hover:not(:disabled) { background: #292524; }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .icon-btn.play { color: #fbbf24; }
    .icon-btn.play:hover:not(:disabled) { color: #fcd34d; }
    .icon-btn.delete { color: #78716c; }
    .icon-btn.delete:hover:not(:disabled) { color: #f87171; }

    .space-y > * + * { margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>תרגול גיטרה 🎸</h1>
      <p class="subtitle">לחץ על הסריגים כדי לבנות מנגינה, שמור ונגן בחזרה לפי הסדר</p>
    </header>

    <div class="space-y">
      <!-- Fretboard -->
      <div class="fretboard-wrap">
        <div class="fret-labels">
          <div class="spacer"></div>
          <div class="label">O</div>
          <div class="label">1</div>
          <div class="label">2</div>
          <div class="label">3</div>
          <div class="label">4</div>
        </div>
        <div class="fretboard">
          <div class="nut"></div>
          <div id="strings"></div>
        </div>
      </div>

      <!-- Sequence panel -->
      <div class="card">
        <div class="panel-header">
          <div class="panel-title">
            רצף הנגינה
            <span class="badge" id="seq-count" style="display:none">0 תווים</span>
          </div>
         <div class="btn-group">
  <button class="btn btn-primary" id="play-btn" disabled>▶ נגן</button>
  <button class="btn btn-stop" id="stop-btn" disabled>■ עצור</button>
  <button class="btn btn-outline" id="clear-btn" disabled>🗑 נקה</button>
</div>
</div>
        <div class="tempo-row">
          <div class="tempo-label">קצב נגינה</div>
          <div class="tempo-slider">
            <span>מהיר</span>
            <input type="range" id="tempo" min="200" max="1500" step="50" value="700" />
            <span>איטי</span>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="empty" id="empty-seq">לחץ על הסריגים כדי לבנות רצף נגינה</div>
      </div>

      <!-- Save bar -->
      <div class="save-bar">
        <input type="text" id="melody-name" placeholder="שם המנגינה..." />
        <button class="btn btn-save" id="save-btn" disabled>💾 שמור</button>
      </div>

      <!-- Saved melodies -->
      <div class="card" id="saved-card" style="display:none">
        <div class="panel-title" style="margin-bottom:0.75rem">
          מנגינות שמורות
          <span class="badge" id="saved-count" style="background:rgba(68,64,60,0.5);color:#a8a29e">0</span>
        </div>
        <div id="saved-list"></div>
      </div>
    </div>
  </div>

  <script>
    const STRING_NAMES = ['E', 'B', 'G', 'D', 'A', 'E']; // string 1 (high) → 6 (low)
    const STRING_THICKNESS = [1, 1.5, 2, 2.5, 3, 3.5];
    const STRING_FREQUENCIES = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41];
    const STORAGE_KEY = 'guitar_melodies';

    let sequence = [];
    let savedMelodies = [];
    let isPlaying = false;
    let playingIndex = -1;
    let tempo = 700;
    let audioContext = null;
    let playbackId = 0;
const activeSources = new Set();

    // ---- Audio (Karplus-Strong plucked string) ----
    function getContext() {
      if (!window.AudioContext) return null;
      if (!audioContext) audioContext = new window.AudioContext();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playNote(stringNumber, fret) {
  const ctx = getContext();
  if (!ctx) return;

  const baseFreq = STRING_FREQUENCIES[stringNumber - 1];
  const frequency = baseFreq * Math.pow(2, fret / 12);
  const duration = 1.2;

  const N = Math.max(2, Math.floor(ctx.sampleRate / frequency));
  const total = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, total, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  const ring = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    ring[i] = Math.random() * 2 - 1;
  }

  let idx = 0;

  for (let i = 0; i < total; i++) {
    data[i] = ring[idx];

    const next = (idx + 1) % N;
    ring[idx] = (ring[idx] + ring[next]) / 2;
    idx = next;
  }

  const src = ctx.createBufferSource();
  src.buffer = buffer;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.5, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + duration
  );

  src.connect(gain);
  gain.connect(ctx.destination);

  activeSources.add(src);

  src.addEventListener('ended', () => {
    activeSources.delete(src);
    src.disconnect();
    gain.disconnect();
  });

  src.start();
}

   async function playSequence(notes, onNote, currentPlaybackId) {
  for (let i = 0; i < notes.length; i++) {
    if (currentPlaybackId !== playbackId || !isPlaying) {
      break;
    }

    onNote(i);
    playNote(notes[i].string, notes[i].fret);

    await new Promise(resolve => setTimeout(resolve, tempo));
  }

  if (currentPlaybackId === playbackId) {
    onNote(-1);
  }
}

    // ---- Build fretboard ----
    function buildFretboard() {
      const container = document.getElementById('strings');
      container.innerHTML = '';
      STRING_NAMES.forEach((name, idx) => {
        const stringNumber = idx + 1;
        const row = document.createElement('div');
        row.className = 'string-row';
        row.dataset.string = stringNumber;

        const sname = document.createElement('div');
        sname.className = 'string-name';
        sname.textContent = name;
        row.appendChild(sname);

        [0, 1, 2, 3, 4].forEach(fret => {
          const btn = document.createElement('button');
          btn.className = 'pos';
          btn.dataset.string = stringNumber;
          btn.dataset.fret = fret;

          if (fret > 0) {
            const wire = document.createElement('div');
            wire.className = 'fret-wire';
            btn.appendChild(wire);
          }
          const line = document.createElement('div');
          line.className = 'string-line';
          line.style.height = STRING_THICKNESS[idx] + 'px';
          btn.appendChild(line);

          const hover = document.createElement('div');
          hover.className = 'hover-ring';
          btn.appendChild(hover);

          btn.addEventListener('click', () => handlePositionClick(stringNumber, fret));
          row.appendChild(btn);
        });
        container.appendChild(row);
      });
    }

    // ---- State ----
    function handlePositionClick(string, fret) {
      if (isPlaying) return;
      sequence.push({ string, fret });
      playNote(string, fret);
      renderAll();
    }

    function stopActiveSounds() {
  activeSources.forEach(src => {
    try {
      src.stop();
    } catch (error) {
      // הצליל כבר הסתיים
    }
  });

  activeSources.clear();
}

function handleStop() {
  if (!isPlaying) return;

  playbackId++;
  isPlaying = false;
  playingIndex = -1;

  stopActiveSounds();
  renderAll();
}

    function handlePlay() {
  if (!sequence.length || isPlaying) return;

  isPlaying = true;
  playingIndex = -1;

  const currentPlaybackId = ++playbackId;

  renderAll();

  playSequence(sequence, (i) => {
    if (currentPlaybackId !== playbackId) return;

    playingIndex = i;
    renderAll();
  }, currentPlaybackId).then(() => {
    if (currentPlaybackId !== playbackId) return;

    isPlaying = false;
    playingIndex = -1;
    renderAll();
  });
}
   function handlePlayMelody(mel) {
  if (isPlaying) return;

  sequence = mel.notes.slice();
  isPlaying = true;
  playingIndex = -1;

  const currentPlaybackId = ++playbackId;

  renderAll();

  playSequence(sequence, (i) => {
    if (currentPlaybackId !== playbackId) return;

    playingIndex = i;
    renderAll();
  }, currentPlaybackId).then(() => {
    if (currentPlaybackId !== playbackId) return;

    isPlaying = false;
    playingIndex = -1;
    renderAll();
  });
}
    function handleSave() {
      const nameInput = document.getElementById('melody-name');
      const name = nameInput.value.trim();
      if (!sequence.length || !name) return;
      savedMelodies.push({ id: Date.now().toString(), name, notes: [...sequence] });
      persistMelodies();
      nameInput.value = '';
      renderAll();
    }
    function handleClear() { sequence = []; playingIndex = -1; renderAll(); }
    function handleRemove(i) { sequence.splice(i, 1); renderAll(); }
    function handleLoad(mel) { sequence = mel.notes.slice(); playingIndex = -1; renderAll(); }
    function handleDelete(id) {
      savedMelodies = savedMelodies.filter(m => m.id !== id);
      persistMelodies();
      renderAll();
    }
    function persistMelodies() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedMelodies)); } catch(e) {}
    }

    // ---- Rendering ----
    function renderFretboard() {
      document.querySelectorAll('.string-row').forEach(row => {
        const s = Number(row.dataset.string);
        const isStringPlaying = playingIndex >= 0 && sequence[playingIndex]?.string === s;
        row.classList.toggle('playing', isStringPlaying);
      });
      document.querySelectorAll('.pos').forEach(btn => {
        const string = Number(btn.dataset.string);
        const fret = Number(btn.dataset.fret);
        const noteIdx = sequence.findIndex(n => n.string === string && n.fret === fret);
        const playing = playingIndex >= 0 && sequence[playingIndex]?.string === string && sequence[playingIndex]?.fret === fret;
        const existingDot = btn.querySelector('.note-dot');
        if (noteIdx >= 0) {
          if (!existingDot) {
            const dot = document.createElement('span');
            dot.className = 'note-dot' + (playing ? ' playing' : '');
            dot.textContent = noteIdx + 1;
            btn.appendChild(dot);
          } else {
            existingDot.textContent = noteIdx + 1;
            existingDot.classList.toggle('playing', playing);
          }
        } else if (existingDot) {
          existingDot.remove();
        }
      });
    }
    function renderChips() {
      const wrap = document.getElementById('chips');
      const empty = document.getElementById('empty-seq');
      const count = document.getElementById('seq-count');
      wrap.innerHTML = '';
      if (!sequence.length) {
        empty.style.display = 'block';
        count.style.display = 'none';
      } else {
        empty.style.display = 'none';
        count.style.display = 'inline-flex';
        count.textContent = sequence.length + ' תווים';
        sequence.forEach((note, idx) => {
          const chip = document.createElement('div');
          chip.className = 'chip' + (playingIndex === idx ? ' playing' : '');
          chip.innerHTML = `
            <span class="num">${idx + 1}</span>
            <span class="sep">·</span>
            <span>${STRING_NAMES[note.string - 1]}</span>
            <span class="sep">/</span>
            <span>${note.fret === 0 ? 'O' : note.fret}</span>
          `;
          if (!isPlaying) {
            const rm = document.createElement('button');
            rm.className = 'remove';
            rm.textContent = '✕';
            rm.title = 'הסר תו';
            rm.addEventListener('click', () => handleRemove(idx));
            chip.appendChild(rm);
          }
          wrap.appendChild(chip);
        });
      }
    }
    function renderSavedMelodies() {
      const card = document.getElementById('saved-card');
      const list = document.getElementById('saved-list');
      const count = document.getElementById('saved-count');
      list.innerHTML = '';
      if (!savedMelodies.length) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      count.textContent = savedMelodies.length;
      savedMelodies.forEach(mel => {
        const item = document.createElement('div');
        item.className = 'melody-item';
        const notesStr = mel.notes.map((n, i) => `${i + 1}. ${STRING_NAMES[n.string - 1]}/${n.fret === 0 ? 'O' : n.fret}`).join(' → ');
        item.innerHTML = `
          <div class="melody-info">
            <div class="melody-name"></div>
            <div class="melody-notes"></div>
          </div>
        `;
        item.querySelector('.melody-name').textContent = mel.name;
        item.querySelector('.melody-notes').textContent = notesStr;

        const actions = document.createElement('div');
        actions.className = 'melody-actions';
        const loadBtn = document.createElement('button');
        loadBtn.className = 'icon-btn'; loadBtn.innerHTML = '📂'; loadBtn.title = 'טען';
        loadBtn.disabled = isPlaying;
        loadBtn.addEventListener('click', () => handleLoad(mel));
        const playBtn = document.createElement('button');
        playBtn.className = 'icon-btn play'; playBtn.innerHTML = '▶'; playBtn.title = 'נגן';
        playBtn.disabled = isPlaying;
        playBtn.addEventListener('click', () => handlePlayMelody(mel));
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete'; delBtn.innerHTML = '🗑'; delBtn.title = 'מחק';
        delBtn.disabled = isPlaying;
        delBtn.addEventListener('click', () => handleDelete(mel.id));
        actions.append(loadBtn, playBtn, delBtn);
        item.appendChild(actions);
        list.appendChild(item);
      });
    }

  function renderControls() {
  const playBtn = document.getElementById('play-btn');
  const stopBtn = document.getElementById('stop-btn');
  const clearBtn = document.getElementById('clear-btn');
  const saveBtn = document.getElementById('save-btn');
  const nameInput = document.getElementById('melody-name');

  playBtn.disabled = isPlaying || !sequence.length;
  stopBtn.disabled = !isPlaying;
  clearBtn.disabled = isPlaying || !sequence.length;

  saveBtn.disabled =
    isPlaying ||
    !sequence.length ||
    !nameInput.value.trim();

  document.getElementById('tempo').disabled = isPlaying;

  playBtn.textContent = isPlaying
    ? '⏳ מנגן...'
    : '▶ נגן';
}

    function renderAll() {
      renderFretboard();
      renderChips();
      renderSavedMelodies();
      renderControls();
    }

    // ---- Init ----
    function init() {
      buildFretboard();
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) savedMelodies = JSON.parse(stored);
      } catch(e) {}
      document.getElementById('play-btn').addEventListener('click', handlePlay);
      document.getElementById('stop-btn').addEventListener('click', handleStop);
      document.getElementById('clear-btn').addEventListener('click', handleClear);
      document.getElementById('save-btn').addEventListener('click', handleSave);
      document.getElementById('tempo').addEventListener('input', (e) => { tempo = Number(e.target.value); });
      const nameInput = document.getElementById('melody-name');
      nameInput.addEventListener('input', () => {
        document.getElementById('save-btn').disabled = isPlaying || !sequence.length || !nameInput.value.trim();
      });
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSave(); });
      renderAll();
    }
    init();
  </script>
</body>
</html>
