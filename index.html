<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת לחיצות</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      margin:0;
      padding:30px;
      text-align:center;
    }
    .box{
      max-width:500px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 4px 18px rgba(0,0,0,.12);
    }
    button{
      font-size:22px;
      padding:14px 28px;
      margin:8px;
      border:0;
      border-radius:12px;
      cursor:pointer;
    }
    #addBtn{
      background:#222;
      color:white;
    }
    #clearBtn{
      background:#ddd;
    }
    #count{
      font-size:28px;
      margin:20px 0;
      font-weight:bold;
    }
    #list{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:20px;
    }
    .item{
      background:#eee;
      padding:12px;
      border-radius:10px;
      font-size:20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>רשימת לחיצות</h2>

    <button id="addBtn">הוסף 1</button>
    <button id="clearBtn">איפוס</button>

    <div id="count">סה״כ: 0</div>
    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = "onesList";

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      list.innerHTML = "";
      count.textContent = "סה״כ: " + items.length;

      items.forEach((value, index) => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = (index + 1) + ". " + value;
        list.appendChild(div);
      });
    }

    addBtn.addEventListener("click", () => {
      items.push(1);
      save();
      render();
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("לאפס את כל הרשימה?")) {
        items = [];
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
